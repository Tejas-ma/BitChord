name: Linux

# The Linux packages, built natively for each architecture: jpackage assembles
# an image from the running JDK, and the FFmpeg/JavaFX/Skiko natives in it are
# the host's, so arm64 is built on an arm64 runner rather than cross-packaged.
# -Pbitchord.arch pins the dependency classifiers to the runner so a mismatch
# fails loudly here instead of producing a package that cannot start.

on:
  push:
    branches: [Devlopment, main]
    paths: &paths
      - 'desktopApp/**'
      - 'desktopUi/**'
      - 'shared/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build-linux.yml'
  pull_request:
    branches: [Devlopment, main]
    paths: *paths
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (defaults to the tag or bitchordVersionName)'
        required: false
        type: string
      run_tests:
        description: 'Run the JVM tests before packaging'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ANDROID_HOME: /__disabled_android_sdk__
  ANDROID_SDK_ROOT: /__disabled_android_sdk__
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Djava.awt.headless=true

jobs:
  linux:
    name: Linux · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            appimage_arch: x86_64
            appimagetool: appimagetool-x86_64.AppImage
          - runner: ubuntu-24.04-arm
            arch: arm64
            appimage_arch: aarch64
            appimagetool: appimagetool-aarch64.AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Resolve the version
        id: version
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          raw="${REQUESTED:-}"
          if [ -z "$raw" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then raw="${GITHUB_REF_NAME}"; fi
          if [ -z "$raw" ]; then
            raw=$(sed -n 's/.*bitchordVersionName"\]\s*=\s*"\([^"]*\)".*/\1/p' build.gradle.kts | head -1)
          fi
          [ -z "$raw" ] && raw="1.9.1"
          raw="${raw#v}"
          echo "raw='$raw'"
          echo "value=$raw" >> "$GITHUB_OUTPUT"

      - name: Write local.properties
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          : > local.properties
          for name in LASTFM_API_KEY LASTFM_SECRET LISTEN_TOGETHER_SERVER; do
            eval "value=\$$name"
            [ -n "$value" ] && printf '%s=%s\n' "$name" "$value" >> local.properties
          done
          exit 0

      - name: Make the wrapper executable
        run: chmod +x gradlew

      # rpm and fakeroot for the two package formats, binutils/file for the
      # AppImage, and the arch-matched appimagetool for the wrapper step.
      - name: Install the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm fakeroot binutils file
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/${{ matrix.appimagetool }}"
          chmod +x appimagetool

      - name: Build the native libraries
        run: |
          ./gradlew :desktopApp:windowsNatives \
            "-Pbitchord.skipAndroid=true" "-Pbitchord.arch=${{ matrix.arch }}" \
            --no-daemon --stacktrace

      - name: Run the JVM tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          ./gradlew :shared:jvmTest :desktopUi:jvmTest :desktopApp:test \
            "-Pbitchord.skipAndroid=true" "-Pbitchord.arch=${{ matrix.arch }}" \
            "-Pbitchord.version=${{ steps.version.outputs.value }}" \
            --no-daemon --stacktrace

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}-test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            desktopUi/build/reports/tests/
            desktopUi/build/test-results/
            desktopApp/build/reports/tests/
            desktopApp/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build the packages
        run: |
          ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm :desktopApp:createDistributable \
            "-Pbitchord.skipAndroid=true" "-Pbitchord.arch=${{ matrix.arch }}" \
            "-Pbitchord.version=${{ steps.version.outputs.value }}" \
            --no-daemon --stacktrace

      # Gradle has no AppImage target; the script wraps the app image jpackage
      # produced, and APPIMAGE_ARCH is what stops an arm64 tree being labelled
      # x86_64.
      - name: Wrap the AppImage
        env:
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
        run: |
          ./desktopApp/packaging/appimage.sh \
            desktopApp/build/compose/binaries/main/app/BitChord \
            "desktopApp/build/distributions/BitChord-${{ steps.version.outputs.value }}-linux-${{ matrix.appimage_arch }}.AppImage" \
            ./appimagetool

      - name: Verify the packages
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find desktopApp/build/compose/binaries/main/app -name 'desktopApp*.jar' -print -quit)
          [ -n "$JAR" ] || { echo "::error::createDistributable produced no app jar"; exit 1; }
          entries=$(unzip -Z1 "$JAR")
          echo "$entries" | grep -q '^native/libbitchord_analysis\.so$' \
            || { echo "::error::the Automix analyser (libbitchord_analysis.so) is missing"; echo "$entries" | grep '^native/' || true; exit 1; }
          echo "$entries" | grep -q '^models/.*\.onnx$' \
            || { echo "::error::no .onnx models were bundled"; exit 1; }
          case "${{ matrix.arch }}" in
            arm64) file desktopApp/build/compose/binaries/main/app/BitChord/bin/BitChord | tee /dev/stderr | grep -q 'aarch64' ;;
            x64)   file desktopApp/build/compose/binaries/main/app/BitChord/bin/BitChord | tee /dev/stderr | grep -q 'x86-64' ;;
          esac
          ls -l desktopApp/build/compose/binaries/main/deb desktopApp/build/compose/binaries/main/rpm
          ls -l desktopApp/build/distributions

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp desktopApp/build/compose/binaries/main/deb/*.deb out/ 2>/dev/null || true
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm out/ 2>/dev/null || true
          cp desktopApp/build/distributions/*.AppImage out/ 2>/dev/null || true
          ls -l out
          [ -n "$(ls -A out)" ] || { echo "::error::no Linux artifact was produced"; exit 1; }

      - name: Upload the packages
        uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
