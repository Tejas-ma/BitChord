name: TV

# The Android TV app builds from the phone app's sources (see tv/README.md), so
# a change under app/, shared/, sharedUi/ or native/ can break it as easily as
# one under tv/.
on:
  push:
    branches: [Devlopment, main]
    paths:
      - 'tv/**'
      - 'app/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/tv.yml'
  pull_request:
    branches: [Devlopment, main]
    paths:
      - 'tv/**'
      - 'app/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/tv.yml'
  workflow_dispatch:

concurrency:
  group: tv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv:
    name: Android TV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5

      - name: Write local.properties
        run: |
          : > local.properties
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> local.properties
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          exit 0

      # The local debug key, so this APK installs over a local dev build and
      # back. Fork PRs get no secrets; AGP then makes a throwaway key itself.
      - name: Write the debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$DEBUG_KEYSTORE_BASE64" ] || exit 0
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - run: chmod +x gradlew

      - name: Build the TV dev APK
        run: ./gradlew :tv:assembleDevDebug -Pbitchord.skipDesktop=true

      - name: Upload the TV dev APK
        uses: actions/upload-artifact@v6
        with:
          name: bitchord-tv-dev-debug
          path: tv/build/outputs/apk/dev/debug/*universal*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: tv-build-reports
          path: tv/build/reports/
          if-no-files-found: ignore
