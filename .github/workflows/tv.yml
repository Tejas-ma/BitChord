name: TV

# The Android TV app builds from the phone app's sources (see tv/README.md), so
# a change under app/, shared/, sharedUi/ or native/ can break it as easily as
# one under tv/.
on:
  push:
    branches: [Devlopment, main]
    paths:
      - 'tv/**'
      - 'app/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/tv.yml'
  pull_request:
    branches: [Devlopment, main]
    paths:
      - 'tv/**'
      - 'app/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/tv.yml'
  workflow_dispatch:

concurrency:
  group: tv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv:
    name: Android TV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5

      - name: Write local.properties
        run: |
          : > local.properties
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> local.properties
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          exit 0

      # The one shared keystore every Android module and build type is signed
      # with (see the signingConfigs block in tv/build.gradle.kts). Fork PRs get
      # no secrets; the build then falls back to AGP's debug key.
      - name: Write the shared release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            [ -n "$value" ] || exit 0
          done
          echo "$KEYSTORE_BASE64" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - run: chmod +x gradlew

      - name: Build the TV dev APK
        run: ./gradlew :tv:assembleDevDebug -Pbitchord.skipDesktop=true

      - name: Upload the TV dev APK
        uses: actions/upload-artifact@v6
        with:
          name: bitchord-tv-dev-debug
          path: tv/build/outputs/apk/dev/debug/*universal*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: tv-build-reports
          path: tv/build/reports/
          if-no-files-found: ignore

      - name: Remove the signing material
        if: always()
        run: rm -f bitchord-release.jks keystore.properties
