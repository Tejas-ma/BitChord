name: Check

on:
  push:
    branches: [Devlopment, main]
  pull_request:
    branches: [Devlopment, main]

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v5

      - name: Write local.properties
        run: |
          : > local.properties
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> local.properties
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" >> local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          exit 0

      # The local debug key, so this APK installs over a local dev build and
      # back. Fork PRs get no secrets; AGP then makes a throwaway key itself.
      - name: Write the debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$DEBUG_KEYSTORE_BASE64" ] || exit 0
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew testDevDebugUnitTest -Pbitchord.skipDesktop=true

      - name: Build the dev APK
        run: ./gradlew assembleDevDebug -Pbitchord.skipDesktop=true

      - name: Upload the dev APK
        uses: actions/upload-artifact@v6
        with:
          name: bitchord-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk
          compression-level: 0

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  backend:
    name: Backend · Go
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
