name: Android APK

# Builds the phone APK on a machine that is not asked to configure the desktop
# modules: -Pbitchord.skipDesktop=true leaves :desktopApp and :desktopUi out of
# the build, so a desktop toolchain that is not installed cannot fail this job.
#
# prodRelease is signed only when every keystore secret is present and the run
# is not a pull request. Anything else falls back to the unsigned devDebug APK
# instead of failing on a key the fork does not have.

on:
  push:
    branches: [Devlopment, main]
    paths:
      - 'app/**'
      - 'tv/**'
      - 'wearos/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [Devlopment, main]
    paths:
      - 'app/**'
      - 'tv/**'
      - 'wearos/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant'
        type: choice
        options: [devDebug, prodRelease]
        default: devDebug
      run_tests:
        description: 'Run the unit tests first'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4608m -Dkotlin.daemon.jvm.options=-Xmx2048m -Djava.net.preferIPv4Stack=true

jobs:
  apk:
    name: Android · ${{ inputs.build_variant || 'devDebug' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # runner.temp is not available in a workflow-level env block, so TMPDIR
      # is pointed at it from a step instead.
      - name: Point TMPDIR at the runner temp dir
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept the Android SDK licenses
        run: |
          sdkmanager="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$sdkmanager" ]; then
            yes | "$sdkmanager" --licenses > /dev/null
          fi
          exit 0

      # sdk.dir is written explicitly: the image sets ANDROID_HOME, but a
      # local.properties that names it survives any wrapper that scrubs the
      # environment, and settings.gradle.kts reads it first.
      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          : > local.properties
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> local.properties
          [ -n "$LASTFM_API_KEY" ] && echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties
          [ -n "$LASTFM_SECRET" ] && echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties
          exit 0

      # Decide before writing anything: a PR, or a fork without secrets, must
      # never be pointed at assembleProdRelease with no key to sign it.
      - name: Decide the variant and whether it can be signed
        id: variant
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REQUESTED: ${{ inputs.build_variant || 'devDebug' }}
          EVENT: ${{ github.event_name }}
        run: |
          signable=true
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            [ -n "$value" ] || signable=false
          done
          if [ "$REQUESTED" = "prodRelease" ] && [ "$signable" = "true" ] && [ "$EVENT" != "pull_request" ]; then
            {
              echo "task=:app:assembleProdRelease"
              echo "path=app/build/outputs/apk/prod/release"
              echo "name=bitchord-prod-release-signed"
              echo "signed=true"
              echo "flavor=prod"
              echo "type=release"
            } >> "$GITHUB_OUTPUT"
          else
            if [ "$REQUESTED" = "prodRelease" ]; then
              echo "::warning::prodRelease needs all four keystore secrets and a non-PR run — building devDebug instead."
            fi
            {
              echo "task=:app:assembleDevDebug"
              echo "path=app/build/outputs/apk/dev/debug"
              echo "name=bitchord-dev-debug"
              echo "signed=false"
              echo "flavor=dev"
              echo "type=debug"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Write the release keystore
        if: steps.variant.outputs.signed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Unit tests
        if: inputs.run_tests != false
        run: >
          ./gradlew :app:testDevDebugUnitTest
          -Pbitchord.skipDesktop=true --no-daemon --max-workers=2 --stacktrace

      - name: Build ${{ steps.variant.outputs.name }}
        run: >
          ./gradlew ${{ steps.variant.outputs.task }}
          -Pbitchord.skipDesktop=true --no-daemon --max-workers=2 --stacktrace

      # ABI splits are on in app/build.gradle.kts, so a build is three per-ABI
      # APKs plus a universal one. archive: false uploads a single file each and
      # takes the download's name from the file on disk, so every APK is copied
      # into dist-apk/ under a name that ends in .apk and says what it is —
      # what arrives on the phone is then installable as-is, with no unzip.
      # Nothing found is an error, not an empty artifact.
      - name: Stage the APKs
        id: apks
        env:
          VARIANT: ${{ steps.variant.outputs.flavor }}-${{ steps.variant.outputs.type }}
          APK_DIR: ${{ steps.variant.outputs.path }}
          SIGNED: ${{ steps.variant.outputs.signed }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^extra\["bitchordVersionName"\] = "\(.*\)"/\1/p' build.gradle.kts | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::Could not read bitchordVersionName from build.gradle.kts"
            exit 1
          fi
          suffix="$(sed -n 's/^extra\["bitchordBetaSuffix"\] = "\(.*\)"/\1/p' build.gradle.kts | head -n 1)"
          if [ -n "$suffix" ]; then
            version="$version-$suffix"
          fi

          rm -rf dist-apk
          mkdir -p dist-apk

          built=()
          if [ -d "$APK_DIR" ]; then
            # An unsigned APK sits beside the signed one it is not a substitute
            # for; only the installable file is wanted here.
            while IFS= read -r apk; do
              built+=("$apk")
            done < <(find "$APK_DIR" -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' | sort)
          fi
          if [ "${#built[@]}" -eq 0 ]; then
            echo "::error::No .apk under $APK_DIR — the build produced nothing to upload."
            exit 1
          fi

          for apk in "${built[@]}"; do
            # app-arm64-v8a-dev-debug -> arm64-v8a; a build without splits is
            # just app-dev-debug, which is staged as the universal APK.
            abi="${apk##*/}"
            abi="${abi%.apk}"
            abi="${abi%-$VARIANT}"
            abi="${abi#app-}"
            case "$abi" in
              armeabi-v7a|arm64-v8a|x86_64|universal) ;;
              *) abi=universal ;;
            esac
            key="${abi//-/_}"
            target="dist-apk/BitChord-$version-$VARIANT-$abi.apk"
            cp "$apk" "$target"
            echo "$key=$GITHUB_WORKSPACE/$target" >> "$GITHUB_OUTPUT"
            echo "Staged $target from $apk"
          done

          # Produced by the same assembleProdRelease, signed with the same key:
          # the watch app only pairs with a phone app signed by the same key.
          # No splits there, so there is exactly one to stage.
          if [ "$SIGNED" = "true" ]; then
            wear="$(find wearos/build/outputs/apk/prod/release -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' 2>/dev/null | sort | head -n 1 || true)"
            if [ -n "$wear" ]; then
              target="dist-apk/BitChord-$version-wear-prod-release.apk"
              cp "$wear" "$target"
              echo "wear=$GITHUB_WORKSPACE/$target" >> "$GITHUB_OUTPUT"
              echo "Staged $target from $wear"
            else
              echo "::warning::No Wear OS APK found; skipping it."
            fi
          fi

      # One step per APK: archive: false accepts a single file path and names the
      # artifact after the file itself, so `name:` is left off deliberately.
      - name: Upload universal APK
        if: steps.apks.outputs.universal != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apks.outputs.universal }}
          archive: false
          if-no-files-found: error

      - name: Upload arm64-v8a APK
        if: steps.apks.outputs.arm64_v8a != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apks.outputs.arm64_v8a }}
          archive: false
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        if: steps.apks.outputs.armeabi_v7a != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apks.outputs.armeabi_v7a }}
          archive: false
          if-no-files-found: error

      - name: Upload x86_64 APK
        if: steps.apks.outputs.x86_64 != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apks.outputs.x86_64 }}
          archive: false
          if-no-files-found: error

      - name: Upload Wear OS APK
        if: steps.apks.outputs.wear != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apks.outputs.wear }}
          archive: false
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Remove the signing material
        if: always()
        run: rm -f bitchord-release.jks keystore.properties
