name: macOS

# The macOS disk images, built on Apple's own runners so jpackage assembles a
# native bundle: an arm64 runner for Apple Silicon, an Intel runner for x64.
# Packaging cannot be cross-built — the JDK and the Skiko/FFmpeg natives in the
# image are the host's architecture — which is why this is a matrix of real
# machines rather than one job with a flag.
#
# Android modules are left out for the same reason the Windows job does:
# settings.gradle.kts must not find an SDK and configure :app on a build that
# has no use for it.

on:
  push:
    branches: [Devlopment, main]
    paths: &paths
      - 'desktopApp/**'
      - 'desktopUi/**'
      - 'shared/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build-macos.yml'
  pull_request:
    branches: [Devlopment, main]
    paths: *paths
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (defaults to the tag or bitchordVersionName)'
        required: false
        type: string
      run_tests:
        description: 'Run the JVM tests before packaging'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  # Pull requests cancel superseded runs; a push queues, so a long DMG build is
  # never thrown away by the next commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ANDROID_HOME: /__disabled_android_sdk__
  ANDROID_SDK_ROOT: /__disabled_android_sdk__
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m -Djava.awt.headless=true

jobs:
  macos:
    name: macOS · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v5

      - name: Resolve the version
        id: version
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          raw="${REQUESTED:-}"
          if [ -z "$raw" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then raw="${GITHUB_REF_NAME}"; fi
          if [ -z "$raw" ]; then
            raw=$(sed -n 's/.*bitchordVersionName"\]\s*=\s*"\([^"]*\)".*/\1/p' build.gradle.kts | head -1)
          fi
          [ -z "$raw" ] && raw="1.9.1"
          raw="${raw#v}"
          echo "raw='$raw'"
          echo "value=$raw" >> "$GITHUB_OUTPUT"

      # Signing and notarization are optional: with none of these set the job
      # still makes a working unsigned DMG, which is what a fork or a pull
      # request should get. The names are read by desktopApp/build.gradle.kts.
      - name: Write local.properties
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ vars.MACOS_NOTARY_TEAM_ID }}
        run: |
          : > local.properties
          for name in LASTFM_API_KEY LASTFM_SECRET LISTEN_TOGETHER_SERVER \
                      MACOS_SIGNING_IDENTITY MACOS_NOTARY_APPLE_ID \
                      MACOS_NOTARY_PASSWORD MACOS_NOTARY_TEAM_ID; do
            eval "value=\$$name"
            [ -n "$value" ] && printf '%s=%s\n' "$name" "$value" >> local.properties
          done
          exit 0

      - name: Make the wrapper executable
        run: chmod +x gradlew

      # Its own step so a C++/CMake failure is named as one, rather than
      # appearing inside "Run the JVM tests" (processResources pulls the
      # analyser in) and skipping packaging behind it.
      - name: Build the native libraries
        run: |
          ./gradlew :desktopApp:windowsNatives \
            "-Pbitchord.skipAndroid=true" "-Pbitchord.arch=${{ matrix.arch }}" \
            --no-daemon --stacktrace

      - name: Run the JVM tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          ./gradlew :shared:jvmTest :desktopUi:jvmTest :desktopApp:test \
            "-Pbitchord.skipAndroid=true" "-Pbitchord.arch=${{ matrix.arch }}" \
            "-Pbitchord.version=${{ steps.version.outputs.value }}" \
            --no-daemon --stacktrace

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}-test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            desktopUi/build/reports/tests/
            desktopUi/build/test-results/
            desktopApp/build/reports/tests/
            desktopApp/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build the disk image
        run: |
          ./gradlew :desktopApp:packageDmg \
            "-Pbitchord.skipAndroid=true" "-Pbitchord.arch=${{ matrix.arch }}" \
            "-Pbitchord.version=${{ steps.version.outputs.value }}" \
            --no-daemon --stacktrace

      # A DMG that exists but has no microphone description, no analyser and
      # no models is worse than none: sound search would be refused by macOS
      # and Automix would silently be missing from the shipped app.
      - name: Verify the bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="desktopApp/build/compose/binaries/main/app/BitChord.app"
          [ -d "$APP" ] || { echo "::error::packageDmg produced no BitChord.app"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP/Contents/Info.plist"

          JAR=$(find "$APP/Contents/app" -maxdepth 1 -name 'desktopApp*.jar' -print -quit)
          [ -n "$JAR" ] || { echo "::error::no desktopApp jar in the bundle"; exit 1; }
          entries=$(/usr/bin/unzip -Z1 "$JAR")
          echo "$entries" | grep -q '^native/libbitchord_analysis.dylib$' \
            || { echo "::error::the Automix analyser (libbitchord_analysis.dylib) is missing"; echo "$entries" | grep '^native/' || true; exit 1; }
          echo "$entries" | grep -q '^models/.*\.onnx$' \
            || { echo "::error::no .onnx models were bundled"; exit 1; }
          echo "$entries" | grep -q '^skiko-macos' \
            || echo "::warning::Skiko is nested in its own jar; the runtime check below covers it"

          # The bundled runtime must be this runner's architecture, not the other one.
          launcher="$APP/Contents/MacOS/BitChord"
          /usr/bin/file "$launcher"
          case "${{ matrix.arch }}" in
            arm64) /usr/bin/file "$launcher" | grep -q 'arm64' ;;
            x64)   /usr/bin/file "$launcher" | grep -q 'x86_64' ;;
          esac

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          for dmg in desktopApp/build/compose/binaries/main/dmg/*.dmg; do
            [ -e "$dmg" ] || continue
            cp "$dmg" "out/BitChord-${{ steps.version.outputs.value }}-macos-${{ matrix.arch }}.dmg"
          done
          ls -l out
          [ -n "$(ls -A out)" ] || { echo "::error::no DMG was produced"; exit 1; }

      - name: Upload the disk image
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
